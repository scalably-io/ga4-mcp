name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install uv && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcpb:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . "${GITHUB_REPOSITORY#*/}.mcpb"
      - run: printf '%s' "$(sha256sum "${GITHUB_REPOSITORY#*/}.mcpb" | cut -d' ' -f1)" > "${GITHUB_REPOSITORY#*/}.mcpb.sha256"
      - run: gh release create "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY#*/}.mcpb" "${GITHUB_REPOSITORY#*/}.mcpb.sha256" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
        env: { GH_TOKEN: "${{ github.token }}" }
